<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#05051b" />
    <title>SGS Future Division Kenshu 2026</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page-shell">
      <header class="site-header">
        <p>SGS FUTURE DIVISION</p>
        <h1>KENSHU <span>2026</span></h1>
      </header>

      <section class="tracker" aria-label="Live RSVP tracker">
        <aside class="regions" aria-label="Regional progress">
          <div class="section-kicker">REGIONAL PROGRESS</div>
          <ol id="region-list"></ol>
        </aside>

        <section class="phoenix-panel" aria-label="Phoenix RSVP reveal">
          <canvas id="phoenix-canvas" aria-label="Phoenix artwork that gains colour as RSVPs increase"></canvas>
          <p id="loading-message" class="loading-message">Loading live RSVP progress…</p>
        </section>
      </section>

      <footer class="stats-bar" aria-live="polite">
        <div><span>LIVE RSVPs</span><strong id="rsvp-total">—</strong></div>
        <div><span>TARGET</span><strong id="rsvp-target">—</strong></div>
        <div><span>OVERALL PROGRESS</span><strong id="overall-progress">—</strong></div>
      </footer>
    </main>
    <script src="app.js"></script>
  </body>
</html>
