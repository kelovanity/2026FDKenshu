<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#050516" />
    <title>SGS Future Division Kenshu 2026</title>
    <link rel="stylesheet" href="styles.css?v=header-safe-3" />
  </head>
  <body>
    <main class="site-frame">
      <header class="masthead">
        <div class="header-kicker"><i></i><span>SGS FUTURE DIVISION</span><i></i></div>
        <h1><span class="title-word">KENSHU</span><em class="title-year">2026</em></h1>
        <div class="header-energy" aria-hidden="true"><i></i><i></i><i></i></div>
      </header>

      <section class="main-grid" aria-label="Live RSVP tracker">
        <aside class="region-card">
          <h2>Region RSVPs to-date</h2>
          <div class="live-line"><i></i><span>UPDATED LIVE</span><time id="updated-time">as of —</time></div>
          <ol id="region-list"></ol>
        </aside>

        <section class="phoenix-stage" aria-label="Phoenix reveal driven by RSVP progress">
          <canvas id="phoenix-canvas"></canvas>
          <p id="loading-message">Loading live RSVP progress…</p>
        </section>
      </section>

      <section class="progress-card" aria-live="polite">
        <div class="metric"><span>TOTAL RSVPS</span><strong id="rsvp-total">—</strong></div>
        <div class="metric"><span>CURRENT TARGET</span><strong class="target" id="rsvp-target">—</strong></div>
        <div class="completion"><div class="ring" id="progress-ring"><div><strong id="overall-progress">—</strong><span>COMPLETED</span></div></div></div>
        <div class="progress-track"><i id="progress-fill"></i></div>
      </section>
    </main>
    <script src="app.js"></script>
  </body>
</html>
